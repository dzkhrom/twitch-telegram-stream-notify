name: Twitch Live Notifier

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check_twitch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Load last state
        run: |
          if [ -f last_state.txt ]; then
            LAST_STATE=$(cat last_state.txt)
          else
            LAST_STATE="offline"
          fi

          echo "LAST_STATE=$LAST_STATE" >> $GITHUB_ENV

      - name: Get Twitch Access Token
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST "https://id.twitch.tv/oauth2/token" \
            -d "client_id=${{ secrets.TWITCH_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.TWITCH_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          echo "TWITCH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Check Twitch Stream Status
        run: |
          STREAM_DATA=$(curl -s \
            -H "Client-ID: ${{ secrets.TWITCH_CLIENT_ID }}" \
            -H "Authorization: Bearer ${{ env.TWITCH_ACCESS_TOKEN }}" \
            "https://api.twitch.tv/helix/streams?user_login=${{ secrets.TWITCH_USERNAME }}")

          echo "STREAM_DATA: $STREAM_DATA"

          echo "$STREAM_DATA" > stream.json

          if [ "$(echo "$STREAM_DATA" | jq '.data | length')" -gt 0 ]; then
            echo "LIVE=true" >> $GITHUB_ENV
          else
            echo "LIVE=false" >> $GITHUB_ENV
          fi

      - name: Extract stream title
        run: |
          TITLE=$(jq -r '.data[0].title // empty' stream.json)

          if [ -z "$TITLE" ]; then
            TITLE="Стрим начался!"
          fi

          echo "TITLE=$TITLE" >> $GITHUB_ENV

      - name: Send Telegram Notification
        if: env.LIVE == 'true' && env.LAST_STATE != 'live'
        run: |
          TEXT=$(cat <<EOF
          Хейхоу! Домашний, уютный стрим уже в эфире ✨

🎮 $TITLE

👉 https://twitch.tv/${{ secrets.TWITCH_USERNAME }}"

          RESPONSE=$(curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$TEXT")

          echo "$RESPONSE"

      - name: Save new state
        run: |
          if [ "${{ env.LIVE }}" = "true" ]; then
            echo "live" > last_state.txt
          else
            echo "offline" > last_state.txt
          fi

      - name: Commit state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stream state"
          file_pattern: last_state.txt
