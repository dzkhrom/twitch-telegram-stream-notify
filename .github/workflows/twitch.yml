name: Twitch Live Notifier

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check_twitch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load last state
        run: |
          if [ -f last_state.txt ]; then
            LAST_STATE=$(cat last_state.txt)
          else
            LAST_STATE="offline"
          fi

          echo "LAST_STATE=$LAST_STATE" >> "$GITHUB_ENV"

        - name: Get Twitch Access Token
  env:
    TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
    TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  run: |
    if [ -z "$TWITCH_CLIENT_ID" ]; then
      echo "ERROR: TWITCH_CLIENT_ID is empty"
      exit 1
    fi

    if [ -z "$TWITCH_CLIENT_SECRET" ]; then
      echo "ERROR: TWITCH_CLIENT_SECRET is empty"
      exit 1
    fi

    echo "Client ID length: ${#TWITCH_CLIENT_ID}"
    echo "Client Secret length: ${#TWITCH_CLIENT_SECRET}"

    HTTP_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
      -X POST \
      "https://id.twitch.tv/oauth2/token" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      --data-urlencode "client_id=$TWITCH_CLIENT_ID" \
      --data-urlencode "client_secret=$TWITCH_CLIENT_SECRET" \
      --data-urlencode "grant_type=client_credentials")

    TOKEN_RESPONSE=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')
    HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)

    echo "Twitch HTTP status: $HTTP_STATUS"

    ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

    if [ -z "$ACCESS_TOKEN" ]; then
      echo "ERROR: Twitch did not return an access token"
      echo "Twitch error:"
      echo "$TOKEN_RESPONSE" | jq '{error, status, message}'
      exit 1
    fi

    echo "Twitch access token received successfully"
    echo "TWITCH_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Check Twitch Stream Status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ env.TWITCH_ACCESS_TOKEN }}
          TWITCH_USERNAME: ${{ secrets.TWITCH_USERNAME }}
        run: |
          if [ -z "$TWITCH_ACCESS_TOKEN" ]; then
            echo "ERROR: TWITCH_ACCESS_TOKEN is empty"
            exit 1
          fi

          STREAM_DATA=$(curl -sS \
            -H "Client-ID: $TWITCH_CLIENT_ID" \
            -H "Authorization: Bearer $TWITCH_ACCESS_TOKEN" \
            "https://api.twitch.tv/helix/streams?user_login=$TWITCH_USERNAME")

          echo "Twitch API response:"
          echo "$STREAM_DATA"

          if echo "$STREAM_DATA" | jq -e '.error' > /dev/null; then
            echo "ERROR: Twitch API returned an error"
            exit 1
          fi

          echo "$STREAM_DATA" > stream.json

          if [ "$(echo "$STREAM_DATA" | jq '.data | length')" -gt 0 ]; then
            echo "LIVE=true" >> "$GITHUB_ENV"
          else
            echo "LIVE=false" >> "$GITHUB_ENV"
          fi

      - name: Extract stream title
        run: |
          TITLE=$(jq -r '.data[0].title // empty' stream.json)

          if [ -z "$TITLE" ]; then
            TITLE="Стрим начался!"
          fi

          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Send Telegram Notification
        if: env.LIVE == 'true' && env.LAST_STATE != 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITCH_USERNAME: ${{ secrets.TWITCH_USERNAME }}
        run: |
          TEXT="Хейхоу! Домашний, уютный стрим уже в эфире ✨

          🎮 $TITLE

          👉 https://twitch.tv/$TWITCH_USERNAME"

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TEXT")

          echo "$RESPONSE"

      - name: Save new state
        run: |
          if [ "$LIVE" = "true" ]; then
            echo "live" > last_state.txt
          else
            echo "offline" > last_state.txt
          fi

      - name: Commit state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stream state"
          file_pattern: last_state.txt
